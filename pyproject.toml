[project]
name = "gitlab-issues-to-github"
version = "1.0.0"
description = "Migrate GitLab issues to GitHub with SOCKS5 proxy support"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygithub>=2.9.1",
    "pysocks>=1.7.1",
    "python-dotenv>=1.2.1",
    "python-gitlab>=8.2.0",
    "requests[socks]>=2.32.5",

]
